<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог курсов по веб-разработке — Stroka</title>
  <meta name="description" content="Курсы по HTML, CSS, JavaScript, TypeScript, React, Next.js, Node.js, SQL, Git, UI/UX, деплою и SEO. Поиск, фильтры по уровню, направлению и формату.">
  <link rel="canonical" href="https://bloody-kumorizora.github.io/Sctrochka-site/catalog.html">
  <meta property="og:site_name" content="Stroka">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Каталог курсов по веб-разработке — Stroka">
  <meta property="og:description" content="Курсы по HTML, CSS, JavaScript, TypeScript, React, Next.js, Node.js, SQL, Git, UI/UX, деплою и SEO. Поиск, фильтры по уровню, направлению и формату.">
  <meta property="og:url" content="https://bloody-kumorizora.github.io/Sctrochka-site/catalog.html">
  <meta property="og:image" content="https://bloody-kumorizora.github.io/Sctrochka-site/img/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e13" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem('stroka-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="catalog">
  <header id="hdr"></header>
  <main id="app">
    <section class="page-head">
      <div class="container">
        <span class="eyebrow"><b>/</b> Каталог</span>
        <h1>Каталог курсов</h1>
        <p class="lead">Вёрстка, JavaScript, фреймворки, бэкенд, дизайн и практикумы. У каждого курса указан статус: полный курс, демо-версия с открытыми уроками или программа в разработке.</p>
      </div>
    </section>
    <div class="catalog-tools" id="catalog-tools">
      <div class="container">
        <form class="tools-row" id="filters" role="search" onsubmit="return false">
          <div class="search-input">
            <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
            <label class="sr-only" for="f-q">Поиск по курсам</label>
            <input id="f-q" name="q" type="search" placeholder="Название, тема или технология" autocomplete="off">
          </div>
          <div><label class="sr-only" for="f-level">Уровень</label><select id="f-level" name="level"><option value="">Любой уровень</option></select></div>
          <div class="filter-extra"><label class="sr-only" for="f-track">Направление</label><select id="f-track" name="track"><option value="">Все направления</option></select></div>
          <div class="filter-extra"><label class="sr-only" for="f-format">Формат</label><select id="f-format" name="format"><option value="">Любой формат</option></select></div>
          <div class="filter-extra"><label class="sr-only" for="f-status">Статус</label><select id="f-status" name="status"><option value="">Любой статус</option></select></div>
        </form>
        <div class="tools-sub">
          <div class="chips">
            <button type="button" class="chip filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="filters">Ещё фильтры</button>
            <button type="button" class="chip" id="f-fav" aria-pressed="false">Только избранное</button>
            <label class="sr-only" for="f-sort">Сортировка</label>
            <select id="f-sort" style="width:auto;min-height:40px;border-radius:999px">
              <option value="recommended">Сначала рекомендуемые</option>
              <option value="level">От простого к сложному</option>
              <option value="level-desc">От сложного к простому</option>
              <option value="short">Сначала короткие</option>
              <option value="title">По названию</option>
            </select>
          </div>
          <span class="result-count" id="result-count" aria-live="polite"></span>
        </div>
      </div>
    </div>
    <div class="container" style="padding-bottom:96px">
      <h2 class="sr-only">Курсы</h2>
      <div id="notice"></div>
      <div class="course-grid" id="list"><div class="course-card skeleton" style="height:200px" aria-hidden="true"></div><div class="course-card skeleton" style="height:200px" aria-hidden="true"></div><div class="course-card skeleton" style="height:200px" aria-hidden="true"></div><div class="course-card skeleton" style="height:200px" aria-hidden="true"></div></div>
    </div>
  </main>

  <script src="js/config.js" defer></script>
  <script src="js/db.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/courses.js" defer></script>
  <script src="js/catalog.js" defer></script>
</body>
</html>
